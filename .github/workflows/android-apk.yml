name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies
        run: npm ci || npm install

      - name: Build web (standalone)
        run: npm run build
        env:
          CAP_STANDALONE: '1'

      - name: Verify dist exists
        run: |
          if [ ! -d dist ] || [ -z "$(ls -A dist)" ]; then
            echo "ERROR: dist/ is missing or empty after build"
            exit 1
          fi
          ls -la dist

      - name: Capacitor sync (standalone)
        run: npx cap sync android
        env:
          CAP_STANDALONE: '1'

      - name: Regenerate Gradle wrapper (ensures valid wrapper jar)
        working-directory: android
        run: |
          GRADLE_VERSION=$(grep -oP 'gradle-\K[0-9]+\.[0-9]+(\.[0-9]+)?' gradle/wrapper/gradle-wrapper.properties | head -1)
          echo "Using Gradle $GRADLE_VERSION"
          gradle wrapper --gradle-version "$GRADLE_VERSION" --distribution-type all
          chmod +x gradlew
          ls -la gradle/wrapper/

      - name: Build Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            android/app/build/reports/
            android/build/reports/
          if-no-files-found: ignore
          retention-days: 7
